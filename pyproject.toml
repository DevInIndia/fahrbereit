[project]
name = "fahrbereit"
version = "0.1.0"
description = "Conversational car buying and rental advisor for the German market"
requires-python = ">=3.11,<4.0"

dependencies = [
    # Agent harness and graph
    "deepagents==0.7.5",
    "langchain==1.3.14",
    "langchain-core==1.5.0",
    "langgraph==1.2.10",

    # Model providers. Only agent/model/ may import these.
    "langchain-google-genai==4.3.2",
    "langchain-openai==1.4.2",

    # Transport. ag-ui-langgraph needs fastapi but does not declare it.
    "ag-ui-langgraph==0.0.42",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",

    # Marketplace MCP server
    "mcp==2.0.0",

    # State
    "pydantic>=2.9",
]

[project.optional-dependencies]
observability = [
    "langfuse==4.14.3",
    "openinference-instrumentation-langchain==0.1.70",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "data*"]
