server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The bundle is a single page application: unknown paths are routes, not files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same origin for the API, so the browser needs no CORS and the reader needs only
  # one URL. An agent turn can take a while, so the timeouts are generous.
  location /api/ {
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering    off;
  }
}
