<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="fahrbereit">
  <title>fahrbereit</title>
  <!--
    The mark, drawn for 16 pixels rather than scaled down to them.

    A dark disc rather than a bare letter: a browser tab strip is a row of squares
    and glyphs, so a circle is what makes this findable, and a solid ground means the
    mark holds against a light or a dark tab bar without needing two files.

    The slant is one skew applied to four rectangles, so every angle in the mark is
    the same angle and the geometry stays exact at any size. Strokes are deliberately
    heavy: at 16 pixels the stem is about three pixels across, which is the floor for
    a shape that still reads as a letter.
  -->
  <circle cx="24" cy="24" r="24" fill="#111111"/>
  <g transform="translate(4.5 0) skewX(-12)">
    <!-- stem -->
    <rect x="12" y="6" width="9" height="36" fill="#ffffff"/>
    <!-- top arm -->
    <rect x="21" y="6" width="17" height="9" fill="#ffffff"/>
    <!-- middle arm, shorter, so the F reads as an F and not as an E -->
    <rect x="21" y="21" width="13" height="9" fill="#ffffff"/>
    <!-- Accent. The gap to the stem is 4 units, which is the smallest that still
         reads at 16 pixels: 4/48 of 16 is 1.3 device pixels. At 3 units it closed up
         under antialiasing and the mark lost its separation. -->
    <rect x="25" y="33" width="9" height="9" fill="#d8531f"/>
  </g>
</svg>
